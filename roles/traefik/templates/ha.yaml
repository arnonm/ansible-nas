http:
#region routers
  routers:
    ha-router:
      entryPoints:
        - "web"
        - "websecure"
      service: ha-service
      rule: "Host(`assist.meshulam.uk`)"
      tls:
        certresolver: "letsencrypt"
      middlewares:
        - default-headers
        - https-redirectscheme


#endregion

#region services
  services:
    ha-service:
      loadBalancer:
        servers:
          - url: "https://192.168.1.206:8123"
#endregion

#middleware region
  middlewares:
    https-redirectscheme:
      redirectScheme:
        scheme: https
        permanent: true


    sslheader:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: https

    default-headers:
      headers:
        frameDeny: true
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 15552000
        customFrameOptionsValue: SAMEORIGIN
        customRequestHeaders:
          X-Forwarded-Proto: https


    idrac:
      headers:
        frameDeny: true
        browserXssFilter: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsSeconds: 15552000
        customFrameOptionsValue: SAMEORIGIN
        customRequestHeaders:
          X-Forwarded-Proto: https

    default-whitelist:
      ipWhiteList:
        sourceRange:
        - "10.0.0.0/8"
        - "10.20.20.0/24"
        - "192.168.0.0/16"
        - "192.168.1.0/24"

    secured:
      chain:
        middlewares:
        - default-whitelist
        - default-headers